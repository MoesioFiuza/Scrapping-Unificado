# Scraper Unificado — Nginx (mesmo padrão do DataWeb em /opt/apps/)
# cp deploy/nginx/scraper.conf /etc/nginx/sites-available/scraper
# ln -sf /etc/nginx/sites-available/scraper /etc/nginx/sites-enabled/scraper
# nginx -t && systemctl reload nginx

server {
    listen 80;
    server_name 212.47.68.222;

    location = /scraper {
        return 301 /scraper/;
    }

    location /scraper/ {
        proxy_pass http://127.0.0.1:8001/;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Prefix /scraper;

        proxy_connect_timeout 620s;
        proxy_send_timeout 620s;
        proxy_read_timeout 620s;

        client_max_body_size 20M;
    }
}
