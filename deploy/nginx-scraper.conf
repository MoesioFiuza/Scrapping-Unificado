# Scraper Unificado — bloco Nginx
# Incluir no server { } principal de 212.47.68.222
# Ex.: include /etc/nginx/snippets/scraper.conf;

# Redireccionar /scraper → /scraper/
location = /scraper {
    return 301 /scraper/;
}

location /scraper/ {
    proxy_pass http://127.0.0.1:8001/;
    proxy_http_version 1.1;

    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Prefix /scraper;

    # DataWeb e extrações CLI podem demorar vários minutos
    proxy_connect_timeout 620s;
    proxy_send_timeout 620s;
    proxy_read_timeout 620s;

    client_max_body_size 20M;
}
